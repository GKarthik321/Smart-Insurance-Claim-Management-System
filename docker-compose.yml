version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: claims-mysql
    environment:
      MYSQL_DATABASE: claimsdb
      MYSQL_USER: claims_user
      MYSQL_PASSWORD: claims_pass
      MYSQL_ROOT_PASSWORD: claims_root_pass
    volumes:
      - claims-mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pclaims_root_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Project
    container_name: claims-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: claimsdb
      DB_USERNAME: claims_user
      DB_PASSWORD: claims_pass
      JWT_SECRET: ChangeThisSecretKeyForProductionUseAtLeast256BitsLongPlease
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: claims-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  claims-mysqldata: