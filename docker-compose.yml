version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: claims-postgres
    environment:
      POSTGRES_DB: claimsdb
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: claims_pass
    volumes:
      - claims-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims_user -d claimsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Project
    container_name: claims-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: claimsdb
      DB_USERNAME: claims_user
      DB_PASSWORD: claims_pass
      JWT_SECRET: ChangeThisSecretKeyForProductionUseAtLeast256BitsLongPlease
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: claims-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  claims-pgdata:
